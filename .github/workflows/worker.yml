# The data worker. Public repository: standard runners are free here, so it can try often and many times.
# Runs every 10 minutes (it scans for missing data and exits quickly when there is none) and whenever the app starts it
# right after a trade is imported (mode "queue"). Only schedule / workflow_dispatch triggers: secrets are never exposed to forks.
name: Data worker
run-name: ${{ inputs.mode == 'queue' && 'Worker queue (automatic)' || 'Data worker' }}

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'queue = started by the app after an import; sweep = a normal pass'
        type: choice
        options: [sweep, queue]
        default: sweep
      dry:
        description: 'Dry run: only print what is missing, store nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-worker
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Until the two secrets are set this job does nothing and stays green (a failing schedule would e-mail the owner every run).
      - name: Check that the secrets are set
        id: cfg
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The repository secrets are not set yet - nothing to do."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.cfg.outputs.ready == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.cfg.outputs.ready == 'true' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: ${{ steps.cfg.outputs.ready == 'true' }}
      - name: Replay data (monthly files, then hours of 1-minute candles)
        if: ${{ steps.cfg.outputs.ready == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        run: |
          set -uo pipefail
          args=(--budget-min 8)
          [ "$DRY" = "1" ] && args+=(--dry)
          node dist/fill-months.mjs "${args[@]}" || echo "::warning::months step failed - continuing with the hours"
          node dist/fill-hours.mjs "${args[@]}"
      - name: Tick data
        if: ${{ !cancelled() && steps.cfg.outputs.ready == 'true' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        run: |
          set -uo pipefail
          args=(--budget-min 4)
          [ "$DRY" = "1" ] && args+=(--dry)
          node dist/fill-ticks.mjs "${args[@]}"
